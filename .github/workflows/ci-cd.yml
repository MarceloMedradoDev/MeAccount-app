name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MeAccount/MeAccount.csproj

      - name: Build
        run: dotnet build MeAccount/MeAccount.csproj --configuration Release --no-restore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MeAccount-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: MeAccount-frontend

      - name: Build
        run: npm run build
        working-directory: MeAccount-frontend

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_DB: meaccount_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_KEY: ci-only-signing-key-at-least-32-characters-long
      JWT_ISSUER: MeAccountCI
      JWT_AUDIENCE: MeAccountCI
      JWT_EXPIRATION_MINUTES: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5188/health >/dev/null && curl --fail --silent http://localhost:4200/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Test authentication flow
        run: |
          email="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          password="CiPassword123"

          register_status=$(curl --silent --output /tmp/register.json --write-out "%{http_code}" \
            --header "Content-Type: application/json" \
            --data "{\"fullName\":\"CI User\",\"email\":\"${email}\",\"password\":\"${password}\"}" \
            http://localhost:4200/api/auth/register)
          test "$register_status" = "200"
          jq --exit-status '.token | length > 0' /tmp/register.json >/dev/null

          login_status=$(curl --silent --output /tmp/login.json --write-out "%{http_code}" \
            --header "Content-Type: application/json" \
            --data "{\"email\":\"${email}\",\"password\":\"${password}\"}" \
            http://localhost:4200/api/auth/login)
          test "$login_status" = "200"
          jq --exit-status '.token | length > 0' /tmp/login.json >/dev/null

          invalid_status=$(curl --silent --output /tmp/invalid-login.json --write-out "%{http_code}" \
            --header "Content-Type: application/json" \
            --data "{\"email\":\"${email}\",\"password\":\"incorrect-password\"}" \
            http://localhost:4200/api/auth/login)
          test "$invalid_status" = "401"
          jq --exit-status '.message == "Email ou senha inválidos"' /tmp/invalid-login.json >/dev/null

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans

  delivery:
    name: Publish container images
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define image names
        id: images
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v7
        with:
          context: MeAccount
          push: true
          tags: |
            ${{ steps.images.outputs.prefix }}-backend:latest
            ${{ steps.images.outputs.prefix }}-backend:${{ github.sha }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v7
        with:
          context: MeAccount-frontend
          push: true
          tags: |
            ${{ steps.images.outputs.prefix }}-frontend:latest
            ${{ steps.images.outputs.prefix }}-frontend:${{ github.sha }}
