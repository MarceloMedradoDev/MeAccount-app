services:
  db:
    image: postgres:17-alpine
    container_name: meaccount-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meaccount}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-meaccount}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./MeAccount
      dockerfile: Dockerfile
    container_name: meaccount-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-meaccount};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
      - Jwt__Issuer=${JWT_ISSUER:-MeAccount}
      - Jwt__Audience=${JWT_AUDIENCE:-MeAccount}
      - Jwt__ExpirationInMinutes=${JWT_EXPIRATION_MINUTES:-60}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5188:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./MeAccount-frontend
      dockerfile: Dockerfile
    container_name: meaccount-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
